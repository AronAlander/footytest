name: Test dashboard

on:
  push:
    paths: ["**.py", "pytest.ini", ".github/workflows/**"]
  pull_request:
    paths: ["**.py", "pytest.ini", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest~=9.1"
      - run: python -m pytest -q
      - name: Browser navigation and rendering
        run: python browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: browser-artifacts/
